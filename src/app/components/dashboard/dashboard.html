<div class="controls">
      <button
        class="action-btn"
        [disabled]="isRefreshing()"
        (click)="refreshAll()"
      >
        {{ isRefreshing() ? 'Refreshing...' : '↻ Refresh' }}
      </button>

      <button
        class="toggle-btn"
        [class.live]="livePolling()"
        [class.idle]="!livePolling()"
        (click)="toggleLivePolling()"
      >
        <span class="dot"></span>
        {{ livePolling() ? 'Live Poll: ON' : 'Live Poll: OFF' }}
      </button>

      <button
        class="toggle-btn"
        [class.on]="ingestionEnabled()"
        [class.off]="!ingestionEnabled()"
        [disabled]="togglingIngestion()"
        (click)="toggleIngestion()"
      >
        <span class="dot"></span>
        {{ ingestionEnabled() ? 'DB Ingestion: ON' : 'DB Ingestion: OFF (Paused)' }}
      </button>
    </div>
